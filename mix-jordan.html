      body::before {

      @keyframes pulseBg {

      /* ===== DAUN SAKURA GUGUR ===== */
      .sakura-container {
        position: fixed;

      .sakura-leaf {
        position: absolute;

        box-shadow: 0 0 8px rgba(255, 150, 190, 0.5);

      .sakura-leaf:nth-child(1) { width: 12px; height: 8px; left: 10%; animation: fall 12s linear infinite; animation-delay: 0s; }
      .sakura-leaf:nth-child(2) { width: 16px; height: 11px; left: 25%; animation: fall 15s linear infinite; animation-delay: 3s; }
      .sakura-leaf:nth-child(3) { width: 10px; height: 7px; left: 45%; animation: fall 9s linear infinite; animation-delay: 1s; }
      .sakura-leaf:nth-child(4) { width: 14px; height: 10px; left: 65%; animation: fall 14s linear infinite; animation-delay: 5s; }
      .sakura-leaf:nth-child(5) { width: 18px; height: 12px; left: 85%; animation: fall 11s linear infinite; animation-delay: 2s; }
      .sakura-leaf:nth-child(6) { width: 12px; height: 8px; left: 35%; animation: fall 13s linear infinite; animation-delay: 7s; }
      .sakura-leaf:nth-child(7) { width: 15px; height: 10px; left: 55%; animation: fall 10s linear infinite; animation-delay: 4s; }
      .sakura-leaf:nth-child(8) { width: 13px; height: 9px; left: 75%; animation: fall 16s linear infinite; animation-delay: 1.5s; }
      .sakura-leaf:nth-child(9) { width: 11px; height: 8px; left: 90%; animation: fall 12s linear infinite; animation-delay: 6s; }
      .sakura-leaf:nth-child(10) { width: 14px; height: 10px; left: 20%; animation: fall 14s linear infinite; animation-delay: 8s; }

      @keyframes fall {
        0% { top: -10%; opacity: 0; transform: translateX(0) rotate(0deg) rotateY(0deg); }
        10% { opacity: 1; }
        90% { opacity: 0.9; }
        100% { top: 110%; opacity: 0; transform: translateX(120px) rotate(540deg) rotateY(360deg); }
      }
      
      /* ===== CONTAINER 4D DENGAN NEON GLOW (TIDAK MUTER) ===== */
      .container { 
        max-width: 420px; 
        width: 90%;
        margin: 20px auto; 
        padding: 25px 20px; 
        display: flex; 
        flex-direction: column; 
        gap: 15px;
        background: rgba(6, 5, 6, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        
        /* Solid Border Neon Tipis */
        border: 2px solid rgba(255, 0, 191, 0.8);
        border-radius: 30px;
        position: relative;
        z-index: 2;
        
        /* Efek Kedalaman 4D */
        transform-style: preserve-3d;
        transform: rotateX(8deg) rotateY(-4deg) translateZ(10px);
        
        /* Animasi Neon Berpendar Lembut (Pulse Neon) & Floating */
        animation: float4D 6s ease-in-out infinite alternate, fadeInUp 0.8s ease;
      }

      /* Perubahan Utama: Fokus ke pendaran bayangan neon aura tanpa efek rotasi background */
      @keyframes float4D {
        0% {

            0 25px 50px rgba(0, 0, 0, 0.8),

        }

      @keyframes fadeInUp {
